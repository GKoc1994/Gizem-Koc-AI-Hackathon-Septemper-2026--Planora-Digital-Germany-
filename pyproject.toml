[project]
name = "bauantragspruefung"
version = "0.1.0"
description = "Vollstaendigkeits- und Formalienpruefung fuer Bauantraege vor Einreichung"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# Schwergewicht (PyTorch-Modelle) - nur fuer echte PDFs noetig
pdf = ["docling>=2.0"]

[project.scripts]
bauantrag-pruefen = "bauantragspruefung.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bauantragspruefung"]
